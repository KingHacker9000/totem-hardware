name: Prototype validation harness

on:
  pull_request:
    paths:
      - "validation/**"
      - "docs/prototype-v1-validation-runbook.md"
      - ".github/workflows/validation.yml"
  push:
    branches: [main]
    paths:
      - "validation/**"
      - "docs/prototype-v1-validation-runbook.md"
      - ".github/workflows/validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Parse evidence JSON artifacts
        run: |
          python -m json.tool validation/evidence.schema.json >/dev/null
          python -m json.tool validation/prototype-v1.template.json >/dev/null
      - name: Self-test capture helper
        run: python validation/capture.py --self-test
