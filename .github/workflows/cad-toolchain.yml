name: CAD toolchain

on:
  pull_request:
    paths:
      - "cad/**"
      - "measurements/**"
      - ".github/workflows/cad-toolchain.yml"
  push:
    branches: [main]
    paths:
      - "cad/**"
      - "measurements/**"
      - ".github/workflows/cad-toolchain.yml"

permissions:
  contents: read

jobs:
  synthetic-cad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cad/requirements.txt
      - name: Install pinned CAD dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cad/requirements.txt
      - name: Validate T917 synthetic measurements
        run: python measurements/validate.py measurements/examples/synthetic.json
      - name: Run CAD helper tests
        run: python -m pytest cad/tests -q
      - name: Build and round-trip synthetic exports
        run: python -m cad.build --verify-round-trip
      - name: Package and verify synthetic provenance
        run: |
          python -m cad.package --source-revision "$GITHUB_SHA" --generated-at "1970-01-01T00:00:00Z"
          python -m cad.package --verify
      - name: Show export manifests
        run: |
          cat cad/build/manifest.json
          cat cad/build/package-manifest.json
